{{define "content"}}
<div id="error" class="hidden mb-4 rounded-lg bg-error-50 px-4 py-3 text-sm text-error-700 dark:bg-error-500/15 dark:text-error-500"></div>

<div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
  <div class="rounded-2xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-white/[0.03] lg:p-6">
    <p class="text-sm text-gray-500 dark:text-gray-400">Total companies</p>
    <h3 id="stat-companies" class="mt-2 text-3xl font-semibold text-gray-800 dark:text-white/90">&mdash;</h3>
  </div>
  <div class="rounded-2xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-white/[0.03] lg:p-6">
    <p class="text-sm text-gray-500 dark:text-gray-400">Total users</p>
    <h3 id="stat-users" class="mt-2 text-3xl font-semibold text-gray-800 dark:text-white/90">&mdash;</h3>
  </div>
</div>

<div class="grid grid-cols-1 gap-4 sm:grid-cols-2 mt-6">
  <a href="/admin/companies" class="rounded-2xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-white/[0.03] lg:p-6 hover:border-brand-300 transition-colors">
    <h4 class="mb-1 font-semibold text-gray-800 dark:text-white/90">Companies</h4>
    <p class="text-sm text-gray-500 dark:text-gray-400">Add, edit, and suspend companies.</p>
  </a>
  <a href="/admin/users" class="rounded-2xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-white/[0.03] lg:p-6 hover:border-brand-300 transition-colors">
    <h4 class="mb-1 font-semibold text-gray-800 dark:text-white/90">Users</h4>
    <p class="text-sm text-gray-500 dark:text-gray-400">Find users across every company.</p>
  </a>
</div>
{{end}}

{{define "scripts"}}
<script src="/static/js/admin-dashboard.js"></script>
<script>AdminDashboard.init();</script>
{{end}}
