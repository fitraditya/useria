{{define "content"}}
<div id="error" class="hidden mb-4 rounded-lg bg-error-50 px-4 py-3 text-sm text-error-700 dark:bg-error-500/15 dark:text-error-500"></div>

<div class="rounded-2xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-white/[0.03] lg:p-6 mb-6">
  <p class="text-sm text-gray-500 dark:text-gray-400">Welcome back,</p>
  <h3 id="welcome-name" class="mt-1 text-2xl font-semibold text-gray-800 dark:text-white/90">&mdash;</h3>
  <p class="mt-2 text-sm text-gray-500 dark:text-gray-400">
    Working in <span id="welcome-company" class="font-medium text-gray-700 dark:text-gray-300">&mdash;</span>
    as <span id="welcome-role" class="font-medium text-gray-700 dark:text-gray-300">&mdash;</span>
  </p>
</div>

<div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
  <a href="/company/members" class="rounded-2xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-white/[0.03] lg:p-6 hover:border-brand-300 transition-colors">
    <h4 class="mb-1 font-semibold text-gray-800 dark:text-white/90">Team Members</h4>
    <p class="text-sm text-gray-500 dark:text-gray-400">Invite teammates and manage roles.</p>
  </a>
  <a href="/profile" class="rounded-2xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-white/[0.03] lg:p-6 hover:border-brand-300 transition-colors">
    <h4 class="mb-1 font-semibold text-gray-800 dark:text-white/90">Your Profile</h4>
    <p class="text-sm text-gray-500 dark:text-gray-400">Update your name and account details.</p>
  </a>
</div>
{{end}}

{{define "scripts"}}
<script src="/static/js/dashboard.js"></script>
<script>Dashboard.init();</script>
{{end}}
