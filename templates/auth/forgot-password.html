{{define "content"}}
<div>
  <div class="mb-5 sm:mb-8">
    <h1 class="mb-2 font-semibold text-gray-800 text-title-sm dark:text-white/90 sm:text-title-md">Forgot password</h1>
    <p class="text-sm text-gray-500 dark:text-gray-400">Enter your email and we'll send you a reset link.</p>
  </div>

  <div id="error" class="hidden mb-4 rounded-lg bg-error-50 px-4 py-3 text-sm text-error-700 dark:bg-error-500/15 dark:text-error-500"></div>
  <div id="success" class="hidden mb-4 rounded-lg bg-success-50 px-4 py-3 text-sm text-success-700 dark:bg-success-500/15 dark:text-success-500">
    If that email is registered, a reset link has been issued.
  </div>

  <form id="forgot-password-form">
    <div class="space-y-5">
      <div>
        <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">Email<span class="text-error-500">*</span></label>
        <input
          type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com"
          class="dark:bg-dark-900 h-11 w-full rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 shadow-theme-xs placeholder:text-gray-400 focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30 dark:focus:border-brand-800"
        />
      </div>
      <button type="submit" class="flex items-center justify-center w-full px-4 py-3 text-sm font-medium text-white transition rounded-lg bg-brand-500 shadow-theme-xs hover:bg-brand-600">
        Send reset link
      </button>
    </div>
  </form>

  <div class="mt-5">
    <p class="text-sm font-normal text-center text-gray-700 dark:text-gray-400 sm:text-start">
      Remembered your password?
      <a href="/login" class="text-brand-500 hover:text-brand-600 dark:text-brand-400">Sign In</a>
    </p>
  </div>
</div>
{{end}}

{{define "scripts"}}
<script src="/static/js/auth.js"></script>
<script>Auth.initForgotPassword();</script>
{{end}}
