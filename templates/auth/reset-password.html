{{define "content"}}
<div>
  <div class="mb-5 sm:mb-8">
    <h1 class="mb-2 font-semibold text-gray-800 text-title-sm dark:text-white/90 sm:text-title-md">Reset password</h1>
    <p class="text-sm text-gray-500 dark:text-gray-400">Choose a new password for your account.</p>
  </div>

  <div id="error" class="hidden mb-4 rounded-lg bg-error-50 px-4 py-3 text-sm text-error-700 dark:bg-error-500/15 dark:text-error-500"></div>
  <div id="no-token" class="hidden mb-4 rounded-lg bg-error-50 px-4 py-3 text-sm text-error-700 dark:bg-error-500/15 dark:text-error-500">
    This reset link is missing its token. Request a new one from the
    <a href="/forgot-password" class="font-medium underline">forgot password</a> page.
  </div>

  <form id="reset-password-form">
    <div class="space-y-5">
      <div>
        <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">New password<span class="text-error-500">*</span></label>
        <input
          type="password" id="password" name="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters"
          class="dark:bg-dark-900 h-11 w-full rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 shadow-theme-xs placeholder:text-gray-400 focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30 dark:focus:border-brand-800"
        />
      </div>
      <div>
        <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">Confirm password<span class="text-error-500">*</span></label>
        <input
          type="password" id="password_confirm" name="password_confirm" required minlength="8" autocomplete="new-password" placeholder="Re-enter password"
          class="dark:bg-dark-900 h-11 w-full rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 shadow-theme-xs placeholder:text-gray-400 focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30 dark:focus:border-brand-800"
        />
      </div>
      <button type="submit" class="flex items-center justify-center w-full px-4 py-3 text-sm font-medium text-white transition rounded-lg bg-brand-500 shadow-theme-xs hover:bg-brand-600">
        Reset password
      </button>
    </div>
  </form>
</div>
{{end}}

{{define "scripts"}}
<script src="/static/js/auth.js"></script>
<script>Auth.initResetPassword();</script>
{{end}}
